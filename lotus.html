<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lotus</title>
<style>
  :root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; background: #03050a; color: #e9e2d0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: Georgia, "Times New Roman", serif; }
  canvas { display: block; max-width: 100%; border-radius: 14px; }
  button { font: inherit; font-size: 1rem; color: #e9e2d0; background: transparent; border: 1px solid #6b665a; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #e9e2d0; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="again" type="button">Bloom again</button>

<script>
const VW = 400, VH = 560;       // logical scene size
const CX = 200, CY = 318, WL = 420; // flower centre, water line
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let k = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.min(window.innerWidth - 8, 520);
  cv.style.width = w + "px"; cv.style.height = w * VH / VW + "px";
  cv.width = w * dpr; cv.height = w * VH / VW * dpr;
  k = w / VW * dpr;
}
window.addEventListener("resize", resize);
resize();

const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const mix = (a, b, t) => a + (b - a) * t;
const rnd = a => { const x = Math.sin(a * 91.7) * 43758.5453; return x - Math.floor(x); };

const STEM_T = 3.3, BLOOM0 = 3.8, HOLD = 6;
const total = BLOOM0 + 1.5 + 2.4 + HOLD;

const stars = Array.from({ length: 55 }, (_, i) => ({ x: rnd(i) * VW, y: rnd(i + 99) * 330, r: 0.4 + rnd(i + 7) * 1.1, p: rnd(i + 3) * 6 }));
const flies = Array.from({ length: 28 }, (_, i) => ({ x: rnd(i + 200) * VW, y: rnd(i + 300) * 420, s: 6 + rnd(i + 400) * 10, p: rnd(i + 500) * 6 }));
const pads = [
  { x: 92, y: 452, rx: 88, ry: 20, d: 0.2, rot: 0.1 },
  { x: 314, y: 470, rx: 78, ry: 18, d: 0.5, rot: -0.15 },
  { x: 205, y: 498, rx: 72, ry: 15, d: 0.8, rot: 0.05 }
];
const layers = [
  { n: 9, sp: 1.38, L: 150, W: 36, tip: "#f28db3", mid: "#ffd3e1" },
  { n: 8, sp: 1.05, L: 138, W: 36, tip: "#ee6fa0", mid: "#ffc6da" },
  { n: 7, sp: 0.72, L: 120, W: 33, tip: "#e8528f", mid: "#ffbcd3" },
  { n: 5, sp: 0.34, L: 96,  W: 30, tip: "#dc3d83", mid: "#ffb0cc" }
];

// stem path: quadratic from below the water up to the flower
const stemPt = t => {
  const u = 1 - t, x0 = CX, y0 = VH + 10, cx = CX - 26, cy = (VH + CY) / 2;
  return { x: u * u * x0 + 2 * u * t * cx + t * t * CX, y: u * u * y0 + 2 * u * t * cy + t * t * CY };
};

function drawBackground(T) {
  const bg = ctx.createLinearGradient(0, 0, 0, WL);
  bg.addColorStop(0, "#03050c"); bg.addColorStop(1, "#0b2430");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  stars.forEach(s => {
    ctx.globalAlpha = 0.35 + 0.45 * Math.sin(T * 1.5 + s.p) ** 2;
    ctx.fillStyle = "#dfe8ff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawStem(sp) {
  const N = 40;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  [["#2f7d48", 7], ["#6cc27c", 2]].forEach(([c, w], i) => {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    ctx.beginPath();
    for (let j = 0; j <= N; j++) {
      const p = stemPt(sp * j / N);
      const x = p.x - (i ? 1.6 : 0);
      j ? ctx.lineTo(x, p.y) : ctx.moveTo(x, p.y);
    }
    ctx.stroke();
  });
}

function petal(L, W, fill) {
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.bezierCurveTo(W * 1.1, -L * 0.25, W * 0.9, -L * 0.8, 0, -L);
  ctx.bezierCurveTo(-W * 0.9, -L * 0.8, -W * 1.1, -L * 0.25, 0, 0);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 1.1; ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(0, -L * 0.1); ctx.lineTo(0, -L * 0.85);
  ctx.moveTo(0, -L * 0.2); ctx.quadraticCurveTo(W * 0.5, -L * 0.45, W * 0.45, -L * 0.7);
  ctx.moveTo(0, -L * 0.2); ctx.quadraticCurveTo(-W * 0.5, -L * 0.45, -W * 0.45, -L * 0.7);
  ctx.stroke();
}

function drawHead(T, hx, hy, S) {
  const open = ease((T - BLOOM0 - 3 * 0.5) / 2.4);
  const bloomed = ease((T - BLOOM0) / 4);
  // soft glow behind the flower
  const glow = ctx.createRadialGradient(hx, hy - 70 * S, 10, hx, hy - 70 * S, 260 * S);
  glow.addColorStop(0, `rgba(255,120,175,${0.32 * bloomed * (0.85 + 0.15 * Math.sin(T * 1.4))})`);
  glow.addColorStop(1, "rgba(255,120,175,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, VW, VH);

  ctx.save(); ctx.translate(hx, hy); ctx.scale(S, S);
  layers.forEach((ly, li) => {
    const o = ease((T - BLOOM0 - li * 0.5) / 2.4);
    const sway = Math.sin(T * 1.1 + li) * 0.016 * o;
    const spread = mix(0.07, ly.sp, o);
    const len = ly.L * mix(0.82, 1, o);
    const gr = ctx.createLinearGradient(0, 0, 0, -len);
    gr.addColorStop(0, "#fff6f8"); gr.addColorStop(0.3, ly.mid); gr.addColorStop(1, ly.tip);
    const idx = [...Array(ly.n).keys()].sort((a, b) => Math.abs(b - (ly.n - 1) / 2) - Math.abs(a - (ly.n - 1) / 2));
    idx.forEach(i => {
      const a = (i / (ly.n - 1) * 2 - 1) * spread + sway;
      ctx.save(); ctx.translate(Math.sin(a) * 12, 0); ctx.rotate(a);
      petal(len, ly.W * mix(0.9, 1, o), gr);
      ctx.restore();
    });
  });
  // stamens and seed pod appear as the lotus opens
  const po = ease((T - BLOOM0 - 1.3) / 1.6);
  if (po > 0) {
    ctx.globalAlpha = po;
    for (let j = 0; j < 30; j++) {
      const a = (j / 29 - 0.5) * 2.5, r = 42 + 6 * Math.sin(j * 2.1);
      const x = Math.sin(a) * r, y = -30 - Math.cos(a) * r * 0.55;
      ctx.strokeStyle = "rgba(255,226,120,0.85)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = "#ffd84d"; ctx.beginPath(); ctx.arc(x, y, 1.9, 0, 7); ctx.fill();
    }
    const pg = ctx.createLinearGradient(0, -58, 0, -30);
    pg.addColorStop(0, "#c6e27a"); pg.addColorStop(1, "#6fa538");
    ctx.fillStyle = pg; ctx.beginPath(); ctx.ellipse(0, -42, 16, 11, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#4d7f28";
    for (let j = 0; j < 7; j++) { ctx.beginPath(); ctx.arc((j - 3) * 3.6, -45 + (j % 2) * 3, 1.3, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawPad(p, T) {
  const s = ease((T - p.d) / 1.2);
  if (s <= 0) return;
  ctx.save(); ctx.translate(p.x, p.y + Math.sin(T * 0.9 + p.x) * 1.2); ctx.rotate(p.rot); ctx.scale(s, s);
  const gr = ctx.createLinearGradient(0, -p.ry, 0, p.ry);
  gr.addColorStop(0, "#3a8d52"); gr.addColorStop(1, "#16442b");
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.ellipse(0, 0, p.rx, p.ry, 0, 0.28, Math.PI * 2 - 0.12);
  ctx.closePath(); ctx.fillStyle = gr; ctx.fill();
  ctx.strokeStyle = "rgba(120,200,130,0.4)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function drawWater(T, bloomed) {
  const w = ctx.createLinearGradient(0, WL, 0, VH);
  w.addColorStop(0, "rgba(8,40,56,0.55)"); w.addColorStop(1, "rgba(2,10,16,0.92)");
  ctx.fillStyle = w; ctx.fillRect(0, WL, VW, VH - WL);
  ctx.strokeStyle = "rgba(160,215,235,0.22)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, WL); ctx.lineTo(VW, WL); ctx.stroke();
  // pink reflection of the flower
  ctx.save(); ctx.translate(CX, WL + 16); ctx.scale(1, 0.25);
  const rf = ctx.createRadialGradient(0, 0, 4, 0, 0, 150);
  rf.addColorStop(0, `rgba(255,120,170,${0.4 * bloomed})`); rf.addColorStop(1, "rgba(255,120,170,0)");
  ctx.fillStyle = rf; ctx.fillRect(-150, -150, 300, 300); ctx.restore();
  pads.forEach(p => drawPad(p, T));
  // ripples around the stem
  for (let j = 0; j < 3; j++) {
    const ph = (T * 0.22 + j / 3) % 1, rx = 24 + 190 * ph;
    ctx.strokeStyle = `rgba(190,230,255,${0.3 * (1 - ph)})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(CX, WL + 22, rx, rx * 0.2, 0, 0, 7); ctx.stroke();
  }
}

function drawFlies(T) {
  const f = ease((T - 5.5) / 2);
  if (f <= 0) return;
  flies.forEach(p => {
    const y = ((p.y - T * p.s) % 420 + 420) % 420, x = p.x + Math.sin(T * 0.7 + p.p) * 14;
    const a = f * 0.7 * (0.5 + 0.5 * Math.sin(T * 2 + p.p));
    const g = ctx.createRadialGradient(x, y, 0, x, y, 6);
    g.addColorStop(0, `rgba(255,205,225,${a})`); g.addColorStop(1, "rgba(255,205,225,0)");
    ctx.fillStyle = g; ctx.fillRect(x - 6, y - 6, 12, 12);
  });
}

function render(T) {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawBackground(T);
  const sp = ease((T - 0.3) / STEM_T);
  const tip = stemPt(Math.max(sp, 0.001));
  const bloomed = ease((T - BLOOM0) / 4);
  const bob = bloomed * Math.sin(T * 1.1) * 2;
  if (sp > 0) {
    drawStem(sp);
    const S = 0.55 + 0.45 * ease((T - 3.2) / 3);
    drawHead(T, tip.x, tip.y + bob, S);
  }
  drawWater(T, bloomed);
  drawFlies(T);
}

let start = performance.now();
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now) {
  let T = (now - start) / 1000;
  if (reduce) T = total;
  else if (T > total) { start = now; T = 0; }
  render(T);
  requestAnimationFrame(frame);
}
document.getElementById("again").addEventListener("click", () => { start = performance.now(); });
cv.addEventListener("click", () => { start = performance.now(); });
requestAnimationFrame(frame);
</script>
</body>
</html>
